<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusBanter</title>
<meta name="description" content="Anonymous campus gossip and private, end-to-end encrypted whispers for verified university students.">
<style>
  :root { color-scheme: light dark; --fg:#18181b; --muted:#52525b; --bg:#fff; --accent:#e11d48; --card:#f4f4f5; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f4f4f5; --muted:#a1a1aa; --bg:#09090b; --accent:#fb7185; --card:#18181b; } }
  body { font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); margin:0; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 24px; text-align: center; }
  .logo { width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 18px; font-size: 42px; line-height: 84px;
          background: linear-gradient(135deg, #f43f5e, #f59e0b); box-shadow: 0 10px 30px rgba(244,63,94,.35); }
  h1 { font-size: 34px; margin: 0 0 8px; }
  p { color: var(--muted); }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
  a.btn { background: var(--card); color: var(--accent); text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 12px; }
  footer { margin-top: 48px; font-size: 14px; color: var(--muted); }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="logo">🎭</div>
  <h1>CampusBanter</h1>
  <p>Anonymous campus gossip and private, end-to-end encrypted whispers &mdash; only for verified university students.</p>
  <div class="links">
    <a class="btn" href="terms.html">Terms of Service</a>
    <a class="btn" href="privacy.html">Privacy Policy</a>
  </div>
  <footer>Questions or reports: <a href="mailto:Support.ProjectZ@gmail.com">Support.ProjectZ@gmail.com</a></footer>
</main>
</body>
</html>
